<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta name="description" content="An application that acts as a senior legal counsel to generate precise, legally sound bilingual (Arabic-English) contracts based on Egyptian law. It gathers contract details from the user and then generates a formal contract.">
  <meta property="og:title" content="Bilingual Legal Contract Generator | منشئ العقود القانونية">
  <meta property="og:description" content="An application that acts as a senior legal counsel to generate precise, legally sound bilingual (Arabic-English) contracts based on Egyptian law.">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="عدالة كونتراكت">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800;900&family=Cinzel:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap');
    
    body {
      font-family: 'Cairo', sans-serif;
    }
    
    .font-amiri {
      font-family: 'Amiri', serif;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* Print & PDF Optimization for Certified Legal Documents */
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        font-size: 10.5pt !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      header, footer, .print\:hidden, nav, button, input {
        display: none !important;
      }
      .contract-paper {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
      }
      .clause-card {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        margin-bottom: 14pt !important;
      }
      .page-break-before {
        page-break-before: always !important;
      }
      .avoid-break {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      @page {
        size: A4 portrait;
        margin: 15mm 12mm 15mm 12mm;
      }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Adala PWA ServiceWorker registered with scope:', reg.scope))
          .catch(err => console.log('Adala PWA ServiceWorker registration failed:', err));
      });
    }
  </script>
